{% load static %}
<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign In Via Google - CivicReport</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary":           "#004532",
            "primary-container": "#065f46",
            "secondary":         "#006c49",
            "on-surface":        "#181c1a",
            "on-surface-variant":"#3f4944",
            "surface-container-lowest": "#ffffff",
            "error":             "#ba1a1a",
          }
        }
      }
    }
  </script>
  <style>body { background-color: #F0FDF4; font-family: 'Public Sans', sans-serif; }</style>
</head>
<body class="h-full flex flex-col text-on-surface">

<!-- Header -->
<header class="bg-[#F0FDF4] border-b border-[#D1FAE5] fixed top-0 w-full z-50">
  <div class="flex justify-between items-center w-full px-8 h-16 max-w-7xl mx-auto">
    <a href="/" class="text-lg font-bold tracking-tight text-[#065F46]">Pokhara Ward 12</a>
  </div>
</header>

<main class="flex-grow flex items-center justify-center px-6 mt-16">
  <div class="w-full max-w-md">

    <!-- Branding -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-primary tracking-tight">Civic Report</h1>
    </div>

    <!-- Card -->
    <div class="bg-white border border-[#D1FAE5] rounded-lg p-8 shadow-sm">

      <!-- Google icon + heading -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-14 h-14 rounded-full bg-[#F0FDF4] border border-[#D1FAE5] flex items-center justify-center mb-4">
          <svg width="28" height="28" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
            <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
          </svg>
        </div>
        <h2 class="text-xl font-semibold text-on-surface">Sign In Via Google</h2>
        <p class="text-sm text-on-surface-variant mt-2 text-center">
          You are about to sign in using a third-party account from Google.
        </p>
      </div>

      <!-- Form -->
      <form method="post">
        {% csrf_token %}
        <button
          type="submit"
          class="w-full flex items-center justify-center gap-3 bg-primary-container text-white font-medium py-3 rounded-lg hover:bg-primary transition-colors cursor-pointer active:opacity-80 mb-4"
        >
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#fff" opacity=".9"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#fff" opacity=".9"/>
            <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z" fill="#fff" opacity=".9"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58Z" fill="#fff" opacity=".9"/>
          </svg>
          Continue with Google
        </button>
      </form>

      <!-- Back link -->
      <div class="text-center border-t border-[#D1FAE5] pt-4">
        <a href="{% url 'account_login' %}" class="text-sm text-primary font-semibold hover:underline">
          ← Back to Login
        </a>
      </div>

    </div>
    <!-- End card -->

  </div>
</main>

<!-- Footer -->
<footer class="bg-[#F0FDF4] border-t border-[#D1FAE5] w-full mt-auto">
  <div class="flex flex-col md:flex-row justify-between items-center py-8 px-8 max-w-7xl mx-auto gap-4 text-xs uppercase tracking-wider text-slate-600">
    <div class="text-sm font-semibold text-[#065F46]">© 2026 Ward 12. Digital Governance Portal.</div>
    <nav class="flex flex-wrap justify-center gap-6">
      <a class="text-slate-500 hover:text-[#065F46] transition-colors" href="#">Privacy Policy</a>
      <a class="text-slate-500 hover:text-[#065F46] transition-colors" href="#">Terms of Service</a>
      <a class="text-slate-500 hover:text-[#065F46] transition-colors" href="#">Contact Support</a>
    </nav>
  </div>
</footer>

</body>
</html>
