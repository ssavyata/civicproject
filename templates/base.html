{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}CivicReport{% endblock %}</title>

  <!-- Fonts -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}"/>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  {% block extra_css %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>

<body>
  {% include "partials/header.html" %}

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
